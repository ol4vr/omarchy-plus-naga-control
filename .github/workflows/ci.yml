name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 libarchive-tools util-linux
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Standard validation (hardware tests remain excluded)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          .venv/bin/python -m buildpython --profile ci
          status=$?
          if [ "$status" -ne 0 ]; then
            test -f buildlog/naga-control/build-summary.md && cat buildlog/naga-control/build-summary.md
            found_failure_log=0
            for log in buildlog/naga-control/step-*.log; do
              test -f "$log" || continue
              grep -q '^Status: failure$' "$log" || continue
              cat "$log"
              found_failure_log=1
            done
            test "$found_failure_log" = 1 || echo "failed-step log not found" >&2
          fi
          exit "$status"
